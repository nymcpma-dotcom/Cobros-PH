<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobros PH – N&amp;M Consulting</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f5;--card:#fff;--tx:#1b2622;--mut:#66736e;--bd:#d9e0dd;--ac:#16735f;--acs:#d6ece6;--rd:#c8382f;--am:#b7791f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--card:#19201d;--tx:#e6ece9;--mut:#93a39c;--bd:#2a3531;--ac:#4cc3a3;--acs:#1f3a33;--rd:#ff6b61;--am:#f0b450}}
*{box-sizing:border-box}
html,body{margin:0;width:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px}
.brand{font-weight:700;font-size:16px}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
nav button{border:none;background:none;padding:6px 10px;border-radius:6px;color:var(--mut)}
nav button.on{background:var(--acs);color:var(--tx);font-weight:600}
.who{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
main{padding:10px 12px;max-width:1500px;margin:0 auto}
h2{font-size:19px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.narrow{max-width:420px;margin:40px auto}
.narrow label{display:block;margin:10px 0 3px;color:var(--mut);font-size:12px}.narrow input{width:100%}
.mut{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:12px}
.kpi.w b{color:var(--am)}.kpi.r b{color:var(--rd)}.kpi.g b{color:var(--ac)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bar i{display:block;height:14px;background:var(--ac);border-radius:3px;min-width:1px}
.bar.o i{background:var(--rd)}.bar em{font-style:normal;color:var(--mut);width:70px;flex:none}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 9px;max-width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:wait}
button.lnk{border:none;background:none;color:var(--ac);padding:6px 4px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{width:100%}
.tw{overflow-x:auto;width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.r{color:var(--rd);font-weight:600}.am{color:var(--am);font-weight:600}.ok{color:var(--ac);font-weight:600}
.sm{font-size:11px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px}
.mapg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.mapg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sw.t{background:var(--ac)}.sw.v{background:var(--rd)}
dialog{max-height:92vh;overflow:auto;width:min(780px,94vw);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px}
dialog label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}
dialog input,dialog select{width:100%}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 14px;border-radius:8px;z-index:20;max-width:90vw}
.hid{display:none!important}
.chk{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;font-size:12px}
.chk input{width:auto}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;background:var(--acs);color:var(--tx);font-weight:600}
.chip.r{background:color-mix(in srgb,var(--rd) 16%,transparent);color:var(--rd)}.chip.am{background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)}.chip.ok{background:var(--acs);color:var(--ac)}.chip.mut{background:var(--bd);color:var(--mut)}
.opt{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0}.opt.win{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.prog{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac)}
.vote label{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}.vote label:has(input:checked){border-color:var(--ac);background:var(--acs)}.vote input[type=radio]{width:auto;margin-top:3px}
@media print{header,.noprint,button{display:none!important}body{background:#fff;color:#000}.card,.kpi{border-color:#ccc;break-inside:avoid}main{max-width:none}}
</style>
</head>
<body>
<header id="top" class="hid">
  <div class="brand">Cobros PH</div>
  <nav id="tabs"></nav>
  <div class="who"><span id="who"></span><button id="out">Salir</button></div>
</header>
<main id="view"><p class="mut">Cargando…</p></main>
<dialog id="dlg"><div id="dlgc"></div></dialog>
<div id="toast" class="hid"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const BK=['0-30','31-60','61-90','91-120','121-150','151-180','+180'];
const bi=d=>d<=30?0:d<=60?1:d<=90?2:d<=120?3:d<=150?4:d<=180?5:6;
const ST=['Aviso enviado','Contactado','Promesa de pago','Arreglo de pago','Pagó – por aplicar','No responde','Escalar a Junta / legal'];
const PROM=['Promesa de pago','Arreglo de pago'];
const ROL={admin:'Administrador',asistente:'Asistente / Secretaria',junta:'Junta Directiva',pendiente:'Pendiente'};
const sp=x=>String(x??'').replace(/\s+/g,' ').trim();
const nz=s=>sp(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[$\s]/g,'');if(!s)return 0;const neg=/^\(.*\)$/.test(s)||/^-|-$/.test(s);s=s.replace(/[()\-]/g,'').replace(/,/g,'');const x=parseFloat(s);return isNaN(x)?0:(neg?-x:x)}
const fmt=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=a=>a.reduce((x,y)=>x+y,0);
const sg$=v=>(v>0.005?'+':v<-0.005?'-':'')+'$'+fmt(Math.abs(v));
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0%';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function pd(v){
 if(v instanceof Date)return isNaN(v)?null:new Date(v.getFullYear(),v.getMonth(),v.getDate());
 if(typeof v==='number')return v>20000&&v<80000?new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4):null;
 const s=sp(v);let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
 m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1])}
 return null}
const fD=d=>{if(typeof d==='string')d=pd(d);return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():''};
const fDT=t=>t?fD(new Date(t)):'';
const dias=t=>Math.floor((Date.now()-new Date(t).getTime())/864e5);
function msg(t){const e=$('#toast');e.textContent=t;e.classList.remove('hid');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.add('hid'),4000)}
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function openDlg(h){$('#dlgc').innerHTML=h;$('#dlg').showModal()}
const closeDlg=()=>$('#dlg').close();
const firma=()=>(window.CONFIG&&CONFIG.FIRMA)||'Administración';

let K=ls.get('cphK',2);const od=r=>sum(r.b.slice(K));const dd=()=>[0,30,60,90][K];
let sb=null,ME=null,PHS=[],PHID=null,TAB=null,PERF={},S={};
const isStaff=()=>ME&&(ME.rol==='admin'||ME.rol==='asistente');
const phName=id=>(PHS.find(p=>p.id==id)||{}).nombre||'PH';

/* ================= datos ================= */
async function all(mk){let out=[],from=0;for(;;){const {data,error}=await mk().range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
const toB=t=>(t||[]).map(Number).concat([0,0,0,0,0,0,0]).slice(0,7);
const toRow=s=>({unidad:s.unidad,propietario:s.propietario||'',correo:s.correo||'',telefono:s.telefono||'',tot:+s.total,b:toB(s.tramos)});
async function getCortes(ph){const {data,error}=await sb.from('cortes').select('*').eq('ph_id',ph).order('fecha');if(error)throw error;return data.map(c=>({...c,total:+c.total,b:toB(c.tramos)}))}
async function getSaldos(cid){return (await all(()=>sb.from('saldos').select('unidad,propietario,correo,telefono,total,tramos').eq('corte_id',cid).order('id'))).map(toRow)}
async function getGest(ph){return all(()=>{let q=sb.from('gestiones').select('*').order('creado',{ascending:false});if(ph!=='all')q=q.eq('ph_id',ph);return q})}
function lastBy(G){const m={};G.forEach(x=>{const k=x.ph_id+'|'+x.unidad;if(!m[k])m[k]=x});return m}
const autor=id=>{const p=PERF[id];return p?(p.nombre||p.email):'—'};
const promVencida=(lg,r)=>lg&&PROM.includes(lg.estado)&&lg.fecha_promesa&&lg.fecha_promesa<today()&&od(r)>0.005;
async function safe(fn){try{await fn()}catch(e){console.error(e);$('#view').innerHTML=`<div class="card"><b>No se pudieron cargar los datos.</b><p class="mut">${esc(e.message||e)}</p></div>`}}
const loading=()=>$('#view').innerHTML='<p class="mut">Cargando…</p>';

/* ================= piezas visuales ================= */
const kpiHtml=items=>`<div class="kpis">${items.map(([a,b,c])=>`<div class="kpi ${c||''}"><b>${b}</b><span>${a}</span></div>`).join('')}</div>`;
function agingHtml(L){const ag=BK.map((_,i)=>sum(L.map(r=>r.b[i]))),mx=Math.max(...ag.map(Math.abs),1);
 return ag.map((v,i)=>`<div class="bar ${i>=K?'o':''}"><em>${BK[i]} d</em><i style="width:${Math.max(0,v)/mx*70}%"></i><span>$${fmt(v)}</span></div>`).join('')}
const VBf=L=>{const v=BK.map((_,i)=>i).filter(i=>L.some(r=>Math.abs(r.b[i])>0.005));return v.length?v:[0]};
const cel=(v,i)=>`<td class="n${i>=K&&v>0.005?' r':''}">${Math.abs(v)>0.005?fmt(v):'–'}</td>`;
function chart(C){
 if(C.length<2)return '<p class="mut">La evolución aparece cuando hay al menos dos cortes cargados.</p>';
 const n=C.length,W=Math.max(340,n*76),Hh=200,top=16,base=Hh-34,mx=Math.max(...C.map(c=>c.total),1),step=(W-20)/n,bw=Math.min(44,step*.62);
 const bars=C.map((c,i)=>{const x=10+i*step+(step-bw)/2,ht=c.total/mx*(base-top),hv=Math.max(0,od(c))/mx*(base-top);
  return `<g><title>${fD(c.fecha)}: saldo $${fmt(c.total)}, vencido $${fmt(od(c))} (${pct(od(c),c.total)})</title>
  <rect x="${x}" y="${base-ht}" width="${bw}" height="${ht}" rx="3" fill="var(--ac)" opacity=".35"/>
  <rect x="${x+bw*.2}" y="${base-hv}" width="${bw*.6}" height="${hv}" rx="2" fill="var(--rd)"/>
  <text x="${x+bw/2}" y="${base-ht-4}" text-anchor="middle" font-size="10" fill="var(--mut)">${pct(od(c),c.total)}</text>
  <text x="${x+bw/2}" y="${base+14}" text-anchor="middle" font-size="10" fill="var(--mut)">${fD(c.fecha).slice(0,5)}</text>
  <text x="${x+bw/2}" y="${base+26}" text-anchor="middle" font-size="9" fill="var(--mut)">${fD(c.fecha).slice(6)}</text></g>`}).join('');
 return `<div class="tw"><svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="Evolución del saldo y lo vencido por corte"><line x1="8" x2="${W-8}" y1="${base}" y2="${base}" stroke="var(--bd)"/>${bars}</svg></div><div class="legend"><span><i class="sw t" style="opacity:.5"></i>Saldo total</span><span><i class="sw v"></i>Vencido +${dd()} d (el % encima de cada barra)</span></div>`}
function phSel(allOpt){if(!allOpt&&PHID==='all')PHID=PHS[0]?.id;
 return `<select id="cph">${allOpt?`<option value="all"${PHID==='all'?' selected':''}>Todas las PH</option>`:''}${PHS.map(p=>`<option value="${p.id}"${p.id==PHID?' selected':''}>${esc(p.nombre)}</option>`).join('')}</select>`}
const kSel=()=>`<label>Vencido desde <select id="ck">${[1,2,3].map(i=>`<option value="${i}"${i===K?' selected':''}>${[0,31,61,91][i]} días</option>`).join('')}</select></label>`;
function bindCtl(full,light){const a=$('#cph');if(a)a.onchange=()=>{PHID=a.value==='all'?'all':+a.value;full()};
 const b=$('#ck');if(b)b.onchange=()=>{K=+b.value;ls.set('cphK',K);(light||full)()}}
const noPH=()=>$('#view').innerHTML=`<div class="card"><h3>Todavía no hay PH registradas</h3><p class="mut">${isStaff()?'Ve a "Cargar reporte", sube el primer reporte de Sage y crea la PH en el mismo paso.':'El administrador aún no te ha asignado una PH.'}</p></div>`;

/* ================= acceso ================= */
function showLogin(){
 $('#top').classList.add('hid');
 $('#view').innerHTML=`<div class="card narrow"><h2>Cobros PH</h2><p class="mut" style="margin-top:-6px">${esc(firma())}</p>
 <label>Correo<input id="lem" type="email" autocomplete="email"></label>
 <label>Contraseña<input id="lpw" type="password" autocomplete="current-password"></label>
 <div id="lnmw" class="hid"><label>Nombre completo<input id="lnm" autocomplete="name"></label></div>
 <div class="flt" style="margin-top:12px"><button class="p" id="lin">Entrar</button><button id="lup">Crear cuenta</button><button class="lnk" id="lfg">Olvidé mi contraseña</button></div>
 <p id="lmsg" class="mut"></p></div>`;
 const em=()=>sp($('#lem').value),pw=()=>$('#lpw').value,say=t=>$('#lmsg').textContent=t;
 $('#lpw').onkeydown=e=>{if(e.key==='Enter')$('#lin').click()};
 $('#lin').onclick=async()=>{if(!em()||!pw())return say('Escribe tu correo y contraseña.');say('Entrando…');
  const {data,error}=await sb.auth.signInWithPassword({email:em(),password:pw()});if(error)return say('No se pudo entrar: revisa el correo y la contraseña.');enter(data.user)};
 $('#lup').onclick=async()=>{if($('#lnmw').classList.contains('hid')){$('#lnmw').classList.remove('hid');return say('Escribe tu nombre y una contraseña de al menos 6 caracteres, y pulsa "Crear cuenta" otra vez.')}
  if(!em()||pw().length<6||!sp($('#lnm').value))return say('Completa correo, nombre y una contraseña de al menos 6 caracteres.');
  say('Creando cuenta…');const {data,error}=await sb.auth.signUp({email:em(),password:pw(),options:{data:{nombre:sp($('#lnm').value)}}});
  if(error)return say('No se pudo crear la cuenta: '+error.message);
  if(data.session)enter(data.user);else say('Cuenta creada. Revisa tu correo para confirmarla y luego entra.')};
 $('#lfg').onclick=async()=>{if(!em())return say('Escribe tu correo arriba y pulsa otra vez "Olvidé mi contraseña".');
  const {error}=await sb.auth.resetPasswordForEmail(em(),{redirectTo:location.origin});say(error?'No se pudo enviar el correo: '+error.message:'Te enviamos un correo con el enlace para crear una nueva contraseña.')};
}
async function recover(){
 openDlg(`<h3>Nueva contraseña</h3><label>Escribe tu nueva contraseña (mínimo 6 caracteres)<input id="npw" type="password"></label><div class="flt" style="margin-top:10px;justify-content:flex-end"><button class="p" id="nok">Guardar contraseña</button></div>`);
 $('#nok').onclick=async()=>{const p=$('#npw').value;if(p.length<6)return msg('Mínimo 6 caracteres.');const {error}=await sb.auth.updateUser({password:p});if(error)return msg(error.message);closeDlg();msg('Contraseña actualizada.');start()};
}
async function enter(user){
 loading();
 const {data:p,error}=await sb.from('perfiles').select('*').eq('id',user.id).maybeSingle();
 if(error||!p){$('#view').innerHTML=`<div class="card narrow"><h3>No se encontró tu perfil</h3><p class="mut">Verifica que el script de la base de datos se haya ejecutado completo antes de crear la cuenta.</p><button id="o2">Salir</button></div>`;$('#o2').onclick=logout;return}
 ME=p;$('#top').classList.remove('hid');$('#who').textContent=(p.nombre||p.email)+' – '+ROL[p.rol];
 if(p.rol==='pendiente'){$('#tabs').innerHTML='';$('#view').innerHTML=`<div class="card narrow"><h3>Tu cuenta está pendiente</h3><p class="mut">El administrador debe asignarte un rol (y tu PH si eres miembro de Junta). Cuando lo haga, vuelve a entrar.</p><button id="rl">Volver a revisar</button></div>`;$('#rl').onclick=()=>enter(user);return}
 const {data:ph}=await sb.from('phs').select('*').order('nombre');PHS=ph||[];PHID=ME.rol==='admin'&&PHS.length>1?'all':(PHS[0]?.id??null);
 if(isStaff()){const {data:pf}=await sb.from('perfiles').select('id,email,nombre,rol');PERF={};(pf||[]).forEach(x=>PERF[x.id]=x)}
 const T=isStaff()?[['cobros','Cobros'],['cargar','Cargar reporte'],['seg','Seguimiento'],['comp','Comparativo'],['junta','Vista Junta'],['apr','Aprobaciones']].concat(ME.rol==='admin'?[['usu','Usuarios']]:[]):[['junta','Mi PH'],['apr','Aprobaciones']];
 $('#tabs').innerHTML=T.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
 $('#tabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b){if(b.dataset.t==='apr')APR.sel=null;go(b.dataset.t)}};
 const hm=location.hash.match(/apr=(\d+)/);if(hm){APR.sel=+hm[1];history.replaceState(null,'',location.pathname+location.search);go('apr');return}
 go(isStaff()&&ME.rol==='admin'?'seg':T[0][0]);aprBadge();
}
async function logout(){await sb.auth.signOut();ME=null;showLogin()}
function go(t){TAB=t;$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));window.scrollTo(0,0);
 ({cobros:vCobros,cargar:vCargar,seg:vSeg,comp:vComp,junta:vJunta,apr:vApr,usu:vUsu})[t]()}

/* ================= COBROS (asistente / admin) ================= */
async function vCobros(){if(!PHS.length)return noPH();loading();await safe(async()=>{
 if(PHID==='all')PHID=PHS[0].id;
 const C=await getCortes(PHID),last=C[C.length-1],L=last?await getSaldos(last.id):[],G=await getGest(PHID);
 S={C,last,L,G,LG:lastBy(G)};
 $('#view').innerHTML=`<div class="card flt noprint">${phSel(false)}${kSel()}<input id="q" placeholder="Buscar unidad o propietario"><select id="fs"><option value="">Todo el seguimiento</option><option value="_">Vencidos sin ninguna gestión</option><option value="15">Vencidos sin gestión en 15+ días</option><option value="pv">Promesas vencidas</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div>
 <p class="mut" style="margin:0 0 8px">${last?`Corte del ${fD(last.fecha)} · ${L.length} unidades con saldo`:'Esta PH todavía no tiene reportes cargados.'}</p>
 <div id="ck2"></div><div class="card"><h3>Antigüedad de saldos</h3><div id="ag"></div></div>
 <div class="card tw"><table><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table><div id="more" class="mut" style="margin-top:8px"></div></div>`;

function build(M){

 A.slice(HI+1).forEach(c=>{
  const unit=sp(g(c,'unit'));if(!unit)return;
  if(c.some(x=>typeof x==='string'&&nz(x).includes('total'))){skip++;return}
  const bv=useB?BK.map((_,i)=>(M['b'+i]??-1)>=0?num(c[M['b'+i]]):0):null;
  const s=M.sal>=0?num(g(c,'sal')):sum(bv||[]);if(!s)return;

  if(fv)d=Math.round((corte-fv)/864e5);else if(M.dv>=0)d=num(g(c,'dv'));else if(fdc)d=Math.round((corte-fdc)/864e5);
  const doc=sp(g(c,'doc'));

  R.push({c,unit,s,d,doc,fv,bv});
 });
 if(hasDoc){const wd=new Set(R.filter(x=>x.doc||x.fv).map(x=>x.unit));R=R.filter(x=>{if(x.doc||x.fv||!wd.has(x.unit))return true;skip++;return false})}

 return {rows:[...map.values()].filter(r=>r.tot>0.005),used:R.length,skip};
}

function cmpRows(La,Lb){const m=new Map();La.forEach(r=>m.set(r.unidad,{u:r.unidad,p:r.propietario,a:r.tot,b:0,oa:od(r),ob:0}));

 const R=[...m.values()];R.forEach(x=>{x.d=x.b-x.a;x.st=x.a<=0.005?'Nueva':x.b<=0.005?'Saldó':x.d<-0.005?'Abonó':x.d>0.005?'Aumentó':'Sin cambio'});
 const T={a:sum(R.map(x=>x.a)),b:sum(R.map(x=>x.b)),oa:sum(R.map(x=>x.oa)),ob:sum(R.map(x=>x.ob)),c:sum(R.map(x=>Math.max(0,-x.d))),au:sum(R.map(x=>Math.max(0,x.d)))};return {R,T}}

  ${M.map(m=>`<tr><td>${esc(m.nombre||'')}</td><td>${esc(m.email||'')}</td><td>${m.voto?(m.voto==='opcion'?esc(opName(m.opcion_id)):VT[m.voto])+` <span class="sm">${fDT(m.actualizado)}</span>`:(s.estado==='abierta'?'<span class="am">Pendiente</span>':'<span class="sm">No votó</span>')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">Esta PH no tiene miembros de Junta asignados. Asígnalos en la pestaña Usuarios.</p>'}</div>`:''}

 ${old.length?`<div class="card"><h3>Opciones de rondas anteriores</h3>${old.map(o=>`<div class="sm" style="margin:4px 0">Ronda ${o.ronda} · <b>Opción ${esc(o.letra)}</b> – ${esc(o.proveedor)} ${money(o.monto)} ${o.pdf_path?`<button class="lnk" data-f="${esc(o.pdf_path)}">Ver PDF</button>`:''}</div>`).join('')}</div>`:''}
 <div class="card"><h3>Bitácora</h3>${(E||[]).map(e=>`<div class="sm" style="margin:3px 0"><b>${fDT(e.creado)} ${new Date(e.creado).toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'})}</b> · ${esc(isStaff()||e.user_id===ME.id||!e.user_id?quien(e.user_id):(['voto','cambio de voto'].includes(e.tipo)?'Miembro de Junta':'Administración'))} · ${esc(e.tipo)}${e.detalle?': '+esc(AE[e.detalle]?AE[e.detalle][0]:e.detalle):''}</div>`).join('')||'<p class="mut">Sin movimientos.</p>'}</div>`;

 if($('#apub'))$('#apub').onclick=()=>{if(confirm('¿Enviar esta solicitud a la Junta? Recibirán el aviso por correo y empieza el plazo de votación.'))act(()=>sb.rpc('apr_publicar',{sid:s.id}),'Solicitud enviada a la Junta.').then(ok=>{if(ok)shareAfter(s.id)})};

 if($('#aanu'))$('#aanu').onclick=()=>{const m=prompt('Motivo de la anulación (opcional):');if(m===null)return;act(()=>sb.rpc('apr_anular',{sid:s.id,motivo:m}),'Solicitud anulada.')};

function waText(s,cur,O){const ph=phName(s.ph_id),u=aUrl(s.id);
 if(s.estado==='abierta')return `📋 *Aprobación pendiente – ${ph}*\n*${s.titulo}*${s.ronda>1?' (nuevas cotizaciones, ronda '+s.ronda+')':''}\n\n${cur.map(o=>`${o.letra}) ${o.proveedor}${o.monto!=null?' – '+money(o.monto):''}`).join('\n')}\n\nSe aprueba con 3 votos. Plazo: ${fDT(s.vence)}\nVer cotizaciones y votar: ${u}`;
 const g=(O||[]).find(o=>o.id==s.opcion_ganadora);
 return `📋 *${ph} – ${s.titulo}*\nResultado: *${(AE[s.estado]||[s.estado])[0]}*${g?`\nOpción ${g.letra}: ${g.proveedor}${g.monto!=null?' – '+money(g.monto):''}`:''}\nDetalle: ${u}`}

async function shareAfter(id){try{const {data:s}=await sb.from('solicitudes').select('*').eq('id',id).single();const {data:O}=await sb.from('opciones').select('*').eq('solicitud_id',id).order('letra');
 const cur=(O||[]).filter(o=>o.ronda===s.ronda);
 openDlg(`<h3>✅ Enviada a la Junta</h3><p>Los miembros de la Junta reciben el aviso por correo. ¿Quieres avisarles también por WhatsApp (por ejemplo, en el chat de la Junta)?</p>
 <textarea id="wtx" rows="9" readonly>${esc(waText(s,cur,O))}</textarea><div class="flt" style="margin-top:10px;justify-content:flex-end"><button id="wcl">Cerrar</button><button class="p" id="wgo">💬 Abrir WhatsApp</button></div>`);

async function verComparativo(s){const box=$('#acmp');box.innerHTML='<p class="mut">Cargando…</p>';
 try{const u=await signed(s.comparativo_path);
  if(/\.pdf$/i.test(s.comparativo_path)){box.innerHTML=`<iframe src="${esc(u)}" style="width:100%;height:70vh;border:1px solid var(--bd);border-radius:6px"></iframe>`;return}
  const buf=await (await fetch(u)).arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});
  box.innerHTML=wb.SheetNames.slice(0,4).map(n=>{const A=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).filter(r=>r.some(c=>sp(c)!==''));
   const w=Math.min(Math.max(0,...A.map(r=>r.length)),20);
   return `${wb.SheetNames.length>1?`<div class="sm" style="margin:8px 0 4px"><b>${esc(n)}</b></div>`:''}<table>${A.slice(0,80).map((r,i)=>`<tr>${Array.from({length:w},(_,j)=>{const c=r[j]??'';const t=i===0?'th':'td';return `<${t}${/^[\s$B\/.\-]*[\d,]+(\.\d+)?%?$/.test(String(c))?' class="n"':''}>${esc(c)}</${t}>`}).join('')}</tr>`).join('')}</table>${A.length>80?'<p class="sm">Se muestran las primeras 80 filas. Descarga el archivo para verlo completo.</p>':''}`}).join('')||'<p class="mut">El archivo está vacío.</p>'}
 catch(e){box.innerHTML=`<p class="r">No se pudo mostrar el archivo: ${esc(e.message)}. Usa "Descargar".</p>`}}

function dlgApr(re){const nueva=!re;

 ${nueva?`<label>PH<select id="nph">${PHS.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}<option value="_new">+ Crear nueva PH…</option></select></label>

 <div class="flt" style="margin-top:10px;justify-content:flex-end"><button id="ncl">Cancelar</button>${nueva?'<button id="nbor">Guardar como borrador</button>':''}<button class="p" id="nok">${nueva?'Guardar y enviar a la Junta':'Reabrir y enviar a la Junta'}</button></div>`);

 const add=()=>{if(ops.children.length>=LET.length)return;ops.insertAdjacentHTML('beforeend',optRow(ops.children.length));relabel()};
 add();add();$('#nadd').onclick=add;
 ops.onclick=e=>{if(e.target.classList.contains('orm')){if(ops.children.length<=1)return msg('Debe haber al menos una opción.');e.target.closest('.optrow').remove();relabel()}};
 if(nueva){$('#nph').onchange=()=>$('#nphw').classList.toggle('hid',$('#nph').value!=='_new');if(!PHS.length)$('#nph').value='_new'}
 $('#ncl').onclick=closeDlg;
 const save=async publicar=>{const say=t=>$('#nmsg').textContent=t;
  const rows=[...ops.querySelectorAll('.optrow')].map(r=>({proveedor:sp(r.querySelector('.opv').value),monto:r.querySelector('.omo').value===''?null:+r.querySelector('.omo').value,detalle:sp(r.querySelector('.ode').value)||null,file:r.querySelector('.opf').files[0]})).filter(o=>o.proveedor||o.file);
  if(nueva&&!sp($('#nti').value))return say('Escribe el título de la solicitud.');

  const big=[$('#ncm').files[0],...rows.map(o=>o.file)].find(f=>f&&f.size>20*1024*1024);if(big)return say(`El archivo "${big.name}" pesa más de 20 MB.`);
  $$('#dlgc button').forEach(b=>b.disabled=true);let sid=re?re.id:null;
  try{let ph=re?re.ph_id:$('#nph').value;
   if(ph==='_new'){const n=sp($('#nphn').value);if(!n)throw new Error('Escribe el nombre de la nueva PH.');say('Creando la PH…');

   if(nueva){say('Guardando la solicitud…');const {data:ns,error}=await sb.from('solicitudes').insert({ph_id:ph,titulo:sp($('#nti').value),descripcion:$('#nde').value.trim()||null}).select().single();if(error)throw error;sid=ns.id}
   const cf=$('#ncm').files[0];if(cf){say('Subiendo el cuadro comparativo…');const p=await upFile(ph,sid,cf);const {error}=await sb.from('solicitudes').update({comparativo_path:p,comparativo_nombre:cf.name}).eq('id',sid);if(error)throw error}

   for(let i=0;i<rows.length;i++){const o=rows[i];say(`Subiendo la opción ${LET[i]}…`);let pdf_path=null;if(o.file)pdf_path=await upFile(ph,sid,o.file);

   if(re){say('Reabriendo…');const {error}=await sb.rpc('apr_reabrir',{sid});if(error)throw error}
   else if(publicar){say('Enviando a la Junta…');const {error}=await sb.rpc('apr_publicar',{sid});if(error)throw error}
   closeDlg();APR.sel=sid;msg(publicar||re?'Solicitud enviada a la Junta.':'Borrador guardado.');await vAprDet(sid);if(publicar||re)shareAfter(sid)}
  catch(e){say('No se pudo completar: '+(e.message||e)+(sid&&nueva?' La solicitud quedó como borrador; puedes revisarla en la lista.':''));$$('#dlgc button').forEach(b=>b.disabled=false)}};
 $('#nok').onclick=()=>save(true);if($('#nbor'))$('#nbor').onclick=()=>save(false);
}

/* ================= arranque ================= */
async function start(){const {data:{session}}=await sb.auth.getSession();if(!session)return showLogin();enter(session.user)}
$('#out').onclick=logout;
if(!window.CONFIG||!CONFIG.SUPABASE_URL||/PEGA_AQUI/.test(CONFIG.SUPABASE_URL+CONFIG.SUPABASE_ANON_KEY)){
 $('#view').innerHTML='<div class="card narrow"><h2>Falta la configuración</h2><p class="mut">Edita el archivo <b>config.js</b> con la Project URL y la clave de tu proyecto de Supabase (paso 3 de la guía).</p></div>';
}else if(!window.supabase){
 $('#view').innerHTML='<div class="card narrow"><h2>Sin conexión</h2><p class="mut">No se pudo cargar la librería de Supabase. Revisa tu conexión a internet y recarga la página.</p></div>';
}else{
 sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
 sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(recover,0)});
 start();
}
</script>
